name: Build aarch64 PHP for Android (PM4)

on:
  push:
    branches: [ android-aarch64-php-patches ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout musl-cross-make
        uses: actions/checkout@v4
        with:
          repository: YoutuberPlay/musl-cross-make
          ref: android-aarch64-php-patches
          path: musl-cross-make

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make autoconf automake libtool libtool-bin m4 wget gzip bzip2 bison g++ git cmake pkg-config re2c ca-certificates

      - name: Pre-download sources
        working-directory: musl-cross-make
        run: |
          mkdir -p sources
          wget --no-check-certificate -O sources/gcc-10.3.0.tar.xz https://ftp.gnu.org/gnu/gcc/gcc-10.3.0/gcc-10.3.0.tar.xz
          wget --no-check-certificate -O sources/binutils-2.44.tar.gz https://ftp.gnu.org/gnu/binutils/binutils-2.44.tar.gz
          wget --no-check-certificate -O sources/gmp-6.3.0.tar.xz https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz
          wget --no-check-certificate -O sources/musl-1.2.5.tar.gz https://musl.libc.org/releases/musl-1.2.5.tar.gz

      - name: Configure toolchain
        working-directory: musl-cross-make
        run: |
          echo "TARGET = aarch64-linux-musl" > config.mak
          echo "OUTPUT = /usr/local" >> config.mak

      - name: Build toolchain
        working-directory: musl-cross-make
        run: make -j$(nproc)

      - name: Install toolchain
        working-directory: musl-cross-make
        run: sudo make install

      - name: Verify toolchain
        run: |
          which aarch64-linux-musl-gcc
          aarch64-linux-musl-gcc --version

      - name: Checkout PHP-Binaries (pm4 branch)
        uses: actions/checkout@v4
        with:
          repository: YoutuberPlay/PHP-Binaries
          ref: pm4
          path: PHP-Binaries

      - name: Build all PHP versions (PM4)
        working-directory: PHP-Binaries
        run: |
          mkdir -p ../artifact/pm4
          for ver in 8.0, 8.1, 8.2; do
            echo "=== Building PHP $ver (PM4) ==="
            CFLAGS="-fno-unwind-tables -fno-asynchronous-unwind-tables" \
            LDFLAGS="-Wl,--gc-sections" \
            ./compile.sh -t android-aarch64 -x -j$(nproc) -P4 -g -z "$ver"
            aarch64-linux-musl-strip --strip-all bin/php7/bin/php
            cp bin/php7/bin/php "../artifact/pm4/php_v${ver}"
            ls -lh "../artifact/pm4/php_v${ver}"
            cp install.log "../artifact/pm4/install-${ver}.log"
          done

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-pm4
          path: |
            PHP-Binaries/install.log
            PHP-Binaries/artifact/pm4/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Package all binaries
        if: success()
        run: |
          tar -cJf php-android-aarch64-pm4.tar.xz -C artifact .
          ls -lh php-android-aarch64-pm4.tar.xz
          find artifact -type f -ls

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: php-android-aarch64-pm4
          path: php-android-aarch64-pm4.tar.xz
          retention-days: 30

name: Build aarch64 PHP for Android

on:
  push:
    branches: [ android-aarch64-php-patches ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout musl-cross-make
        uses: actions/checkout@v4
        with:
          repository: YoutuberPlay/musl-cross-make
          ref: android-aarch64-php-patches
          path: musl-cross-make

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make autoconf automake libtool m4 wget gzip bzip2 bison g++ git cmake pkg-config re2c ca-certificates

      - name: Configure toolchain
        working-directory: musl-cross-make
        run: |
          echo "TARGET = aarch64-linux-musl" > config.mak
          echo "OUTPUT = /usr/local" >> config.mak

      - name: Build toolchain
        working-directory: musl-cross-make
        run: make -j$(nproc)

      - name: Install toolchain
        working-directory: musl-cross-make
        run: sudo make install

      - name: Verify toolchain
        run: |
          which aarch64-linux-musl-gcc
          aarch64-linux-musl-gcc --version

      - name: Checkout PHP-Binaries
        uses: actions/checkout@v4
        with:
          repository: YoutuberPlay/PHP-Binaries
          ref: master
          path: PHP-Binaries

      - name: Build PHP 8.4
        working-directory: PHP-Binaries
        run: |
          ./compile.sh -t android-aarch64 -x -j$(nproc) -P5 -z 8.4

      - name: Package PHP
        run: |
          mkdir -p artifact
          cp -r PHP-Binaries/bin/php7 artifact/php8.4
          tar -czf php-8.4-android-aarch64.tar.gz -C artifact .
          ls -lh php-8.4-android-aarch64.tar.gz

      - name: Upload PHP artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-8.4-android-aarch64
          path: php-8.4-android-aarch64.tar.gz
          retention-days: 30
